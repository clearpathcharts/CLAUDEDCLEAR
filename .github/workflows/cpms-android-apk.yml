name: CPMS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'src/cpms/**'
      - 'src/lib/cpms/**'
      - 'src/components/CpmsApk.tsx'
      - '.github/workflows/cpms-android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'src/cpms/**'
      - 'src/lib/cpms/**'
      - 'src/components/CpmsApk.tsx'

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install dependencies and sync Capacitor
        run: npm ci && npm run cap:sync

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --write-locks

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpms-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
