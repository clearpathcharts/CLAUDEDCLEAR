name: CPMS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'src/cpms/**'
      - 'src/lib/cpms/**'
      - 'src/components/CpmsApk.tsx'
      - '.github/workflows/cpms-android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'src/cpms/**'
      - 'src/lib/cpms/**'
      - 'src/components/CpmsApk.tsx'

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies and sync Capacitor
        run: npm ci && npm run cap:sync

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpms-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
