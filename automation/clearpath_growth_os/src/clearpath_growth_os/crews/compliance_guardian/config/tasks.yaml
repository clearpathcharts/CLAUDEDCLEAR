audit_task:
  description: >
    Audit every item in the content batch below against the ClearPath compliance
    rules. Cross-check factual claims against the FAQs and education corpus.

    Content batch:
    {content_payload}

    Reject or rewrite anything that:
      - promises or implies returns / profit / "guaranteed" outcomes
      - implies ClearPath is a broker or holds client funds
      - claims the AI predicts or forecasts the market
      - cites unverified statistics or feature counts (e.g. "500+ indicators")
      - uses fake scarcity/urgency not backed by the real country-cap mechanic
      - cites numbers from a 'demo': true news response as if they were real
    For each item, decide: "pass", "rewrite", or "reject".
  expected_output: >
    A JSON object: {"verdict": "approved" | "needs_revision",
    "flags": [{"platform","issue","offending_text","suggested_rewrite"}],
    "approved_count", "flagged_count"}. Set verdict to "approved" ONLY if there
    are zero flags.
  agent: compliance_auditor
