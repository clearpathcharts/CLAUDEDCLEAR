pillar_article_task:
  description: >
    Write the pillar article for {run_date}. Pillar: "{pillar_title}"
    (slug: {pillar_slug}, related page: {related_page}). Target keywords:
    {target_keywords}. Pull the ClearPath education corpus to ground and
    internally link the piece. 1200-1800 words, clear headings, a short FAQ,
    plain language, no return promises. Run the body through the internal-link
    tool before finalising.
  expected_output: >
    JSON: {"title","slug","meta_description","target_keywords":[...],
    "body_markdown","internal_links":[...],"faq":[{"q","a"}...]}.
  agent: pillar_writer

cluster_task:
  description: >
    Build the supporting cluster for the pillar above. Use these angles as the
    seed set (produce one post brief per angle): {supporting_posts}. For each,
    give: title, target long-tail keyword, meta description, a 5-7 point outline,
    and the internal link back to the pillar ({related_page}). Keep every angle
    beginner- and neurodivergent-friendly.
  expected_output: >
    JSON array (8-10 items): [{"title","target_keyword","meta_description",
    "outline":[...],"internal_link"}...].
  agent: cluster_architect
  context:
    - pillar_article_task
