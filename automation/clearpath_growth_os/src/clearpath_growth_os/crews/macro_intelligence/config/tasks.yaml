scan_markets_task:
  description: >
    It is {run_date}. Build ClearPath's daily macro read.
    1. Use the news/sentiment tool for these themes: {focus_themes}.
    2. Pull at least two macro series (e.g. CPIAUCSL, FEDFUNDS, or M2SL) and at
       least two live quotes from this watchlist: {watchlist}.
    3. If any tool returns 'demo': true or an ERROR, say so explicitly and do
       NOT invent replacement numbers.
    Summarise what actually moved and why, in <= 500 words. Every number must be
    traceable to a tool result.
  expected_output: >
    A concise "ClearPath Morning Brief" (<= 500 words) with a headline, 3-5
    bullet takeaways, and an explicit "Data confidence" line noting any demo /
    missing data. No return promises, no brokerage language.
  agent: macro_sentinel

teachable_moments_task:
  description: >
    Using the morning brief, fetch the ClearPath education corpus and produce
    exactly 3 "teachable moments". Each one takes a concept from today's brief
    (e.g. inflation, liquidity, correlations) and explains it in plain language
    a beginner understands, then links to the most relevant real /learn or
    /macro page from the corpus.
  expected_output: >
    A JSON array of 3 objects, each: {"concept", "plain_explanation" (<=120
    words), "related_page" (a real path from the corpus)}.
  agent: education_translator
  context:
    - scan_markets_task
