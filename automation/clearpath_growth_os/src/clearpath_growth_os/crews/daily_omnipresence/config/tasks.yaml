x_pack_task:
  description: >
    It is {run_date} (day {day_index} of the 30-day phase). Message pillar of the
    day: "{message_pillar}". Produce the X pack: {x_posts} standalone posts and
    {x_threads} thread(s).

    Source material:
    {research_payload}

    Requirements:
      - One post = morning-brief takeaway; one = pattern-of-the-day (use the
        candles/quote tool for a REAL symbol, or say "no live data" if the tool
        errors — never invent prices); one = teachable moment; remaining = the
        message pillar of the day.
      - The thread (5-7 posts) tells one story that ends on a soft CTA.
      - If today's scarcity country "{scarcity_country}" returns verified=true
        from the scarcity tool, you MAY include one spots-left post. If
        verified=false, DO NOT mention spots left.
      - No return promises, no brokerage language, no unverified feature counts.
  expected_output: >
    JSON: {"x_posts": [{"copy","pillar","cta","target_page"}...],
    "x_thread": {"posts": ["..."], "cta", "target_page"}}.
  agent: x_strategist

linkedin_task:
  description: >
    Write {linkedin_posts} LinkedIn post for {run_date}, institutional tone,
    built on the morning brief and the message pillar "{message_pillar}". Lead
    with a macro or education insight; weave in ClearPath's cognitive-diversity
    thesis; close with a soft CTA to a real page.
    Research: {research_payload}
  expected_output: >
    JSON: {"copy","angle","cta","target_page","hashtags":[...]}.
  agent: linkedin_strategist

shortform_task:
  description: >
    Script {shortform_scripts} short videos (TikTok/Reels/Shorts) for {run_date}.
    At least one MUST be the "sensory overload -> Low Stimulation layout" concept.
    Each script needs: hook (first 1.5s), 3-5 shot/beat list, on-screen text,
    voiceover/caption, CTA, and hashtags. Show only real product capabilities.
  expected_output: >
    JSON array of scripts: [{"concept","hook","beats":[...],"onscreen_text":[...],
    "caption","cta","hashtags":[...]}...].
  agent: shortform_director
