draft_social_task:
  description: >
    Using the morning brief and teachable moments below, draft a platform-native
    content batch for {run_date}. Rotate across ClearPath's pillars:
    brain-first/neuro-adaptive, "if trading and ChatGPT had a baby", not-a-broker
    trust, pattern-in-60-seconds, school-of-markets, and terminal speed.

    Brief + teachable moments:
    {research_payload}

    Produce, at minimum:
      - 4 X posts (<= 280 chars each)
      - 1 X thread (5-7 posts)
      - 1 LinkedIn post (credible, institutional tone)
      - 2 short-video scripts (TikTok/Reels, 30-60s, with on-screen text beats)
      - 1 Instagram carousel outline (5-7 slides)
    Every asset must be truthful, avoid return promises, and avoid claiming
    unverified feature counts. Prefer concrete real capabilities: 14 neuro
    layout profiles, automatic pattern scanner, AI mentor, 10 education schools.
  expected_output: >
    A JSON array named "content_queue". Each item:
    {"platform", "format", "pillar", "copy", "cta", "target_page"}.
  agent: hook_engineer

enrich_task:
  description: >
    Take the drafted content_queue and, for every item, ensure the target_page
    is a REAL path found in the ClearPath education corpus or is one of the known
    marketing routes (/trading-ai, /about, /macro, /learn, /faq). Fix any invented
    URLs. For long-form items (threads, LinkedIn, carousels), run the body text
    through the auto internal-link tool and store the linked version.
  expected_output: >
    The final "content_queue" JSON array, cleaned, with valid target_page values
    and (where applicable) a "linked_copy" field containing internally-linked text.
  agent: cta_router
  context:
    - draft_social_task
