<!doctype html>
<html lang="en">
  <head>
    <script>
      // Apply WCAG display prefs before paint (avoids neuro→high-contrast flash)
      try {
        var hc = localStorage.getItem('cp_a11y_high_contrast') === 'true';
        var rs = localStorage.getItem('cp_a11y_reduced_sensory') === 'true';
        var root = document.documentElement;
        root.setAttribute('data-high-contrast', hc ? 'true' : 'false');
        root.setAttribute('data-reduced-sensory', rs ? 'true' : 'false');
        // CTA fills always use mid-tone WCAG-safe pink/orange
        root.style.setProperty('--cpt-pink', '#d81b60');
        root.style.setProperty('--cpt-orange', '#e65100');
        root.style.setProperty('--cpt-cta-on-pink', '#ffffff');
        root.style.setProperty('--cpt-cta-on-orange', '#ffffff');
        root.style.setProperty('--cpt-text-pink', hc ? '#f9a8d4' : '#f472b6');
        root.style.setProperty('--cpt-text-orange', hc ? '#fdba74' : '#fb923c');
        root.style.setProperty('--cpt-text-purple', hc ? '#f3e8ff' : '#e9d5ff');
      } catch (e) {}
    </script>
    <script>
      // Force-unregister stale/old service workers that cause frozen black screens
      try {
        if (typeof navigator !== 'undefined' && navigator.serviceWorker) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister().then(function(success) {
                if (success) console.log('[Purge] Unregistered SW');
              });
            }
          });
        }
      } catch (e) {}
    </script>
    <script>
      // Boot watchdog: if React never replaces the black loader, show recovery UI.
      // Cleared when window.__CP_BOOT_OK is set by main.tsx / BootReadySignal.
      (function () {
        var BOOT_MS = 12000;
        window.setTimeout(function () {
          try {
            if (window.__CP_BOOT_OK) return;
            if (document.documentElement.getAttribute('data-cp-boot') === 'ok') return;
            var root = document.getElementById('root');
            if (!root) return;
            // If React already rendered substantial UI, stand down.
            if (root.querySelector('.clearpath-glass-root, [data-cp-app], main, #main-content')) {
              window.__CP_BOOT_OK = true;
              return;
            }
            var reason = window.__CP_BOOT_FAILED || 'App did not become ready in time';
            root.innerHTML =
              '<div role="alert" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1.5rem;background:#050505;color:#fff;font-family:system-ui,sans-serif;text-align:center">' +
              '<p style="font-size:10px;letter-spacing:0.3em;text-transform:uppercase;color:#fb7185">ClearPath boot timeout</p>' +
              '<p style="max-width:28rem;color:#a1a1aa;font-size:14px;line-height:1.5">The page stayed on the loading screen too long. This is usually a JavaScript crash or a blocked script — not an empty site. Try reload. If it keeps failing, check the browser console and Cloud Run client env (Firebase).</p>' +
              '<pre style="max-width:36rem;overflow:auto;padding:1rem;border:1px solid #27272a;border-radius:12px;background:#000;color:#fecdd3;font-size:11px;text-align:left"></pre>' +
              '<button type="button" style="padding:0.65rem 1.25rem;border-radius:999px;border:1px solid #22d3ee55;background:#083344;color:#a5f3fc;font-size:12px;font-weight:800;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer">Reload</button>' +
              '</div>';
            var pre = root.querySelector('pre');
            if (pre) pre.textContent = String(reason);
            var btn = root.querySelector('button');
            if (btn) btn.onclick = function () { location.reload(); };
            document.documentElement.setAttribute('data-cp-boot', 'timeout');
          } catch (e) {}
        }, BOOT_MS);
      })();
    </script>
